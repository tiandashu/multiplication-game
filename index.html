<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>9x9乘法口诀表挑战</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 0;
        }

        .game-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
            margin-bottom: 20px;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-weight: bold;
            font-size: 2rem;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: block;
        }

        .form-control {
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .question-display {
            text-align: center;
            font-size: 3rem;
            font-weight: bold;
            margin: 30px 0;
            color: #667eea;
            padding: 40px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 20px;
            border: 3px solid #667eea;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 30px 0;
        }

        .option-btn {
            padding: 30px;
            font-size: 2rem;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .option-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .option-btn:active {
            transform: translateY(0);
        }

        .option-btn.correct {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }

        .option-btn.wrong {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .stat-item {
            text-align: center;
            flex: 1;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }

        .control-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px 5px;
            font-weight: bold;
            display: inline-block;
        }

        .btn-start {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        }

        .btn-stop {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
        }

        .btn-reset {
            background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.4);
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .progress-bar {
            height: 12px;
            background: #e9ecef;
            border-radius: 6px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }

        .welcome-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .welcome-icon {
            font-size: 5rem;
            color: #667eea;
            margin-bottom: 20px;
        }

        .welcome-text {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 30px;
            line-height: 2;
        }

        .result-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .result-score {
            font-size: 4rem;
            font-weight: bold;
            color: #667eea;
            margin: 30px 0;
        }

        .result-details {
            font-size: 1.2rem;
            color: #666;
            line-height: 2;
        }

        .leaderboard {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
        }

        .leaderboard-title {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            font-weight: bold;
            font-size: 1.5rem;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .leaderboard-item.rank-1 {
            border-left: 5px solid #ffd700;
            background: linear-gradient(90deg, #fff9e6 0%, white 100%);
        }

        .leaderboard-item.rank-2 {
            border-left: 5px solid #c0c0c0;
            background: linear-gradient(90deg, #f5f5f5 0%, white 100%);
        }

        .leaderboard-item.rank-3 {
            border-left: 5px solid #cd7f32;
            background: linear-gradient(90deg, #fff0e6 0%, white 100%);
        }

        .leaderboard-rank {
            font-size: 2rem;
            font-weight: bold;
            width: 60px;
            text-align: center;
        }

        .leaderboard-info {
            flex: 1;
            text-align: center;
        }

        .leaderboard-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .leaderboard-date {
            font-size: 0.8rem;
            color: #999;
        }

        .leaderboard-time {
            font-size: 1.5rem;
            font-weight: bold;
            color: #667eea;
        }

        .answer-history {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            overflow-x: auto;
        }

        .history-title {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            font-weight: bold;
            font-size: 1.5rem;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            min-width: 600px;
        }

        .history-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .history-table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
            font-size: 0.95rem;
        }

        .history-table tbody tr:hover {
            background: #e9ecef;
        }

        .history-correct {
            color: #28a745;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .history-wrong {
            color: #dc3545;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .accuracy-chart {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
        }

        .chart-bar {
            height: 40px;
            background: #e9ecef;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 15px;
            position: relative;
        }

        .chart-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 15px;
            color: white;
            font-weight: bold;
        }

        .chart-label {
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        /* 移动端优化 */
        @media (max-width: 768px) {
            .game-container {
                padding: 10px;
            }

            .card {
                padding: 20px;
            }

            .title {
                font-size: 1.5rem;
            }

            .question-display {
                font-size: 2.2rem;
                padding: 25px;
            }

            .option-btn {
                padding: 25px;
                font-size: 1.8rem;
            }

            .stat-value {
                font-size: 2rem;
            }

            .stat-label {
                font-size: 0.8rem;
            }

            .control-btn {
                padding: 12px 30px;
                font-size: 1rem;
            }

            .result-score {
                font-size: 2.5rem;
            }

            .result-details {
                font-size: 1rem;
            }

            .welcome-text {
                font-size: 1rem;
            }

            .welcome-icon {
                font-size: 4rem;
            }

            .leaderboard-time {
                font-size: 1.2rem;
            }

            .options-grid {
                gap: 10px;
            }

            .answer-history {
                padding: 10px;
            }

            .history-table {
                font-size: 0.8rem;
            }

            .history-table th {
                padding: 8px;
                font-size: 0.75rem;
            }

            .history-table td {
                padding: 8px;
                font-size: 0.8rem;
            }
        }

        /* 超小屏幕 */
        @media (max-width: 480px) {
            .question-display {
                font-size: 1.8rem;
                padding: 20px;
            }

            .option-btn {
                padding: 20px;
                font-size: 1.5rem;
            }

            .stats-bar {
                flex-direction: column;
                gap: 15px;
            }

            .stat-item {
                width: 100%;
            }

            .control-btn {
                width: 100%;
                margin: 5px 0;
            }

            .title {
                font-size: 1.3rem;
            }

            .history-table {
                font-size: 0.7rem;
            }

            .history-table th {
                padding: 6px;
                font-size: 0.7rem;
            }

            .history-table td {
                padding: 6px;
                font-size: 0.75rem;
            }
        }

        /* 触摸优化 */
        @media (hover: none) and (pointer: coarse) {
            .option-btn {
                min-height: 80px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .control-btn {
                min-height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- 欢迎屏幕 -->
        <div id="welcomeScreen" class="card">
            <h1 class="title">
                <i class="bi bi-calculator"></i> 9x9乘法口诀表挑战
            </h1>
            
            <div class="input-group">
                <label class="form-label">你的名字</label>
                <input type="text" class="form-control" id="studentName" placeholder="请输入你的名字" maxlength="20">
            </div>

            <div class="input-group">
                <label class="form-label">班级（可选）</label>
                <input type="text" class="form-control" id="studentClass" placeholder="例如：三年级1班" maxlength="30">
            </div>

            <div class="welcome-screen">
                <div class="welcome-icon">
                    <i class="bi bi-trophy"></i>
                </div>
                <p class="welcome-text">
                    欢迎来到9x9乘法口诀表挑战！<br>
                    点击开始挑战，随机出题，快速选择正确答案。<br>
                    系统会记录你的答题时间和正确率，看看你能得多少分！
                </p>
                <button class="control-btn btn-start" id="startGameBtn">
                    <i class="bi bi-play-circle"></i> 开始挑战
                </button>
            </div>
        </div>

        <!-- 游戏屏幕 -->
        <div id="gameScreen" class="card" style="display: none;">
            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-value" id="currentQuestion">0</div>
                    <div class="stat-label">题目数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="correctCount">0</div>
                    <div class="stat-label">正确数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="avgTime">0.0</div>
                    <div class="stat-label">平均用时(秒)</div>
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>

            <div class="question-display" id="questionDisplay">
                1 × 1 = ?
            </div>

            <div class="options-grid" id="optionsGrid">
                <button class="option-btn" data-index="0">1</button>
                <button class="option-btn" data-index="1">2</button>
                <button class="option-btn" data-index="2">3</button>
                <button class="option-btn" data-index="3">4</button>
            </div>

            <div class="text-center">
                <button class="control-btn btn-stop" id="stopGameBtn">
                    <i class="bi bi-stop-circle"></i> 停止挑战
                </button>
            </div>
        </div>

        <!-- 结果屏幕 -->
        <div id="resultScreen" class="card" style="display: none;" class="result-screen">
            <h2 style="text-align: center;">挑战结束！</h2>
            <div class="result-score" id="finalAvgTime">0.0秒</div>
            <div class="result-details">
                <p>学生: <strong id="finalStudentName">-</strong></p>
                <p>班级: <strong id="finalStudentClass">-</strong></p>
                <p>总题数: <strong id="totalQuestions">0</strong></p>
                <p>正确数: <strong id="finalCorrect">0</strong></p>
                <p>错误数: <strong id="finalWrong">0</strong></p>
                <p>正确率: <strong id="accuracy">0%</strong></p>
            </div>

            <!-- 正确率分析 -->
            <div class="accuracy-chart">
                <h3 style="text-align: center; margin-bottom: 20px;">正确率分析</h3>
                <div id="accuracyBars">
                    <!-- 动态生成 -->
                </div>
            </div>

            <!-- 答题记录 -->
            <div class="answer-history">
                <div class="history-title">
                    <i class="bi bi-list-check"></i> 答题记录
                </div>
                <table class="history-table" id="historyTable">
                    <thead>
                        <tr>
                            <th>题号</th>
                            <th>题目</th>
                            <th>你的答案</th>
                            <th>正确答案</th>
                            <th>结果</th>
                            <th>用时</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <!-- 动态生成 -->
                    </tbody>
                </table>
            </div>

            <div class="text-center mt-4">
                <button class="control-btn btn-start" id="restartBtn">
                    <i class="bi bi-play-circle"></i> 再来一次
                </button>
                <button class="control-btn btn-reset" id="homeBtn">
                    <i class="bi bi-house"></i> 返回首页
                </button>
            </div>
        </div>

        <!-- 排行榜 -->
        <div class="card">
            <div class="leaderboard-title">
                <i class="bi bi-trophy"></i> 排行榜
            </div>
            <div id="leaderboardList">
                <p class="text-center text-muted">暂无记录</p>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
