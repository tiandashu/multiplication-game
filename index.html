<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9x9乘法口诀表挑战</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .game-container {
            max-width: 600px;
            margin: 20px auto;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-weight: bold;
        }

        .question-display {
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            margin: 40px 0;
            color: #667eea;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
            border: 3px solid #667eea;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 30px 0;
        }

        .option-btn {
            padding: 25px;
            font-size: 28px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .option-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .option-btn:active {
            transform: translateY(0);
        }

        .option-btn.correct {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }

        .option-btn.wrong {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        .control-btn {
            padding: 12px 30px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
            font-weight: bold;
        }

        .btn-start {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        }

        .btn-stop {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
        }

        .btn-reset {
            background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.4);
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .leaderboard {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
        }

        .leaderboard-title {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            font-weight: bold;
            font-size: 24px;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .leaderboard-item.rank-1 {
            border-left: 5px solid #ffd700;
            background: linear-gradient(90deg, #fff9e6 0%, white 100%);
        }

        .leaderboard-item.rank-2 {
            border-left: 5px solid #c0c0c0;
            background: linear-gradient(90deg, #f5f5f5 0%, white 100%);
        }

        .leaderboard-item.rank-3 {
            border-left: 5px solid #cd7f32;
            background: linear-gradient(90deg, #fff0e6 0%, white 100%);
        }

        .leaderboard-rank {
            font-size: 24px;
            font-weight: bold;
            width: 50px;
            text-align: center;
        }

        .leaderboard-info {
            flex: 1;
            text-align: center;
        }

        .leaderboard-date {
            font-size: 12px;
            color: #999;
        }

        .leaderboard-time {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
        }

        .progress-bar {
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }

        .welcome-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .welcome-icon {
            font-size: 80px;
            color: #667eea;
            margin-bottom: 20px;
        }

        .welcome-text {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .result-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .result-score {
            font-size: 64px;
            font-weight: bold;
            color: #667eea;
            margin: 30px 0;
        }

        .result-details {
            font-size: 18px;
            color: #666;
            line-height: 2;
        }

        @media (max-width: 576px) {
            .game-container {
                margin: 10px;
                padding: 20px;
            }

            .question-display {
                font-size: 36px;
                padding: 20px;
            }

            .option-btn {
                padding: 20px;
                font-size: 24px;
            }

            .stat-value {
                font-size: 24px;
            }

            .leaderboard-time {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="title">
            <i class="bi bi-calculator"></i> 9x9乘法口诀表挑战
        </h1>

        <!-- 欢迎屏幕 -->
        <div id="welcomeScreen" class="welcome-screen">
            <div class="welcome-icon">
                <i class="bi bi-trophy"></i>
            </div>
            <p class="welcome-text">
                欢迎来到9x9乘法口诀表挑战！<br>
                点击开始挑战，随机出题，快速选择正确答案。<br>
                系统会记录你的答题时间，看看你能得多少分！
            </p>
            <button class="control-btn btn-start" onclick="startGame()">
                <i class="bi bi-play-circle"></i> 开始挑战
            </button>
        </div>

        <!-- 游戏屏幕 -->
        <div id="gameScreen" style="display: none;">
            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-value" id="currentQuestion">0</div>
                    <div class="stat-label">题目数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="correctCount">0</div>
                    <div class="stat-label">正确数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="avgTime">0.0</div>
                    <div class="stat-label">平均用时(秒)</div>
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>

            <div class="question-display" id="questionDisplay">
                1 × 1 = ?
            </div>

            <div class="options-grid" id="optionsGrid">
                <button class="option-btn" onclick="selectAnswer(0)">1</button>
                <button class="option-btn" onclick="selectAnswer(1)">2</button>
                <button class="option-btn" onclick="selectAnswer(2)">3</button>
                <button class="option-btn" onclick="selectAnswer(3)">4</button>
            </div>

            <div class="text-center">
                <button class="control-btn btn-stop" onclick="stopGame()">
                    <i class="bi bi-stop-circle"></i> 停止挑战
                </button>
            </div>
        </div>

        <!-- 结果屏幕 -->
        <div id="resultScreen" style="display: none;" class="result-screen">
            <div class="welcome-icon">
                <i class="bi bi-award"></i>
            </div>
            <h2>挑战结束！</h2>
            <div class="result-score" id="finalAvgTime">0.0秒</div>
            <div class="result-details">
                <p>总题数: <strong id="totalQuestions">0</strong></p>
                <p>正确数: <strong id="finalCorrect">0</strong></p>
                <p>正确率: <strong id="accuracy">0%</strong></p>
            </div>
            <div class="text-center mt-4">
                <button class="control-btn btn-start" onclick="startGame()">
                    <i class="bi bi-play-circle"></i> 再来一次
                </button>
                <button class="control-btn btn-reset" onclick="showWelcome()">
                    <i class="bi bi-house"></i> 返回首页
                </button>
            </div>
        </div>

        <!-- 排行榜 -->
        <div class="leaderboard" id="leaderboard">
            <div class="leaderboard-title">
                <i class="bi bi-trophy"></i> 排行榜
            </div>
            <div id="leaderboardList">
                <p class="text-center text-muted">暂无记录</p>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
