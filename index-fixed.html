<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9x9乘法口诀表挑战 - 测试版</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .game-container {
            max-width: 600px;
            margin: 20px auto;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-weight: bold;
        }

        .question-display {
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            margin: 40px 0;
            color: #667eea;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
            border: 3px solid #667eea;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 30px 0;
        }

        .option-btn {
            padding: 25px;
            font-size: 28px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .option-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .option-btn:active {
            transform: translateY(0);
        }

        .option-btn.correct {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }

        .option-btn.wrong {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        .control-btn {
            padding: 12px 30px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
            font-weight: bold;
        }

        .btn-start {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        }

        .btn-stop {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
        }

        .btn-reset {
            background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.4);
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .progress-bar {
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }

        .welcome-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .welcome-icon {
            font-size: 80px;
            color: #667eea;
            margin-bottom: 20px;
        }

        .welcome-text {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .result-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .result-score {
            font-size: 64px;
            font-weight: bold;
            color: #667eea;
            margin: 30px 0;
        }

        .result-details {
            font-size: 18px;
            color: #666;
            line-height: 2;
        }

        @media (max-width: 576px) {
            .game-container {
                margin: 10px;
                padding: 20px;
            }

            .question-display {
                font-size: 36px;
                padding: 20px;
            }

            .option-btn {
                padding: 20px;
                font-size: 24px;
            }

            .stat-value {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="title">
            <i class="bi bi-calculator"></i> 9x9乘法口诀表挑战
        </h1>

        <!-- 欢迎屏幕 -->
        <div id="welcomeScreen" class="welcome-screen">
            <div class="welcome-icon">
                <i class="bi bi-trophy"></i>
            </div>
            <p class="welcome-text">
                欢迎来到9x9乘法口诀表挑战！<br>
                点击开始挑战，随机出题，快速选择正确答案。<br>
                系统会记录你的答题时间，看看你能得多少分！
            </p>
            <button class="control-btn btn-start" id="startBtn">
                <i class="bi bi-play-circle"></i> 开始挑战
            </button>
        </div>

        <!-- 游戏屏幕 -->
        <div id="gameScreen" style="display: none;">
            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-value" id="currentQuestion">0</div>
                    <div class="stat-label">题目数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="correctCount">0</div>
                    <div class="stat-label">正确数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="avgTime">0.0</div>
                    <div class="stat-label">平均用时(秒)</div>
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>

            <div class="question-display" id="questionDisplay">
                1 × 1 = ?
            </div>

            <div class="options-grid" id="optionsGrid">
                <button class="option-btn" data-index="0">1</button>
                <button class="option-btn" data-index="1">2</button>
                <button class="option-btn" data-index="2">3</button>
                <button class="option-btn" data-index="3">4</button>
            </div>

            <div class="text-center">
                <button class="control-btn btn-stop" id="stopBtn">
                    <i class="bi bi-stop-circle"></i> 停止挑战
                </button>
            </div>
        </div>

        <!-- 结果屏幕 -->
        <div id="resultScreen" style="display: none;" class="result-screen">
            <div class="welcome-icon">
                <i class="bi bi-award"></i>
            </div>
            <h2>挑战结束！</h2>
            <div class="result-score" id="finalAvgTime">0.0秒</div>
            <div class="result-details">
                <p>总题数: <strong id="totalQuestions">0</strong></p>
                <p>正确数: <strong id="finalCorrect">0</strong></p>
                <p>正确率: <strong id="accuracy">0%</strong></p>
            </div>
            <div class="text-center mt-4">
                <button class="control-btn btn-start" id="restartBtn">
                    <i class="bi bi-play-circle"></i> 再来一次
                </button>
                <button class="control-btn btn-reset" id="homeBtn">
                    <i class="bi bi-house"></i> 返回首页
                </button>
            </div>
        </div>
    </div>

    <script>
        // 9x9乘法口诀表挑战游戏 - 内联版本
        // 作者: 工匠
        // 版本: 1.0.0

        // 游戏状态
        const gameState = {
            isPlaying: false,
            currentQuestion: 0,
            correctCount: 0,
            totalTime: 0,
            questionStartTime: 0,
            currentAnswer: 0,
            canAnswer: true
        };

        // DOM 元素
        const welcomeScreen = document.getElementById('welcomeScreen');
        const gameScreen = document.getElementById('gameScreen');
        const resultScreen = document.getElementById('resultScreen');
        const questionDisplay = document.getElementById('questionDisplay');
        const optionsGrid = document.getElementById('optionsGrid');
        const currentQuestionEl = document.getElementById('currentQuestion');
        const correctCountEl = document.getElementById('correctCount');
        const avgTimeEl = document.getElementById('avgTime');
        const progressFill = document.getElementById('progressFill');

        // 绑定按钮事件
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('stopBtn').addEventListener('click', stopGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);
        document.getElementById('homeBtn').addEventListener('click', showWelcome);

        // 开始游戏
        function startGame() {
            console.log('开始游戏');
            gameState.isPlaying = true;
            gameState.currentQuestion = 0;
            gameState.correctCount = 0;
            gameState.totalTime = 0;
            gameState.canAnswer = true;

            welcomeScreen.style.display = 'none';
            resultScreen.style.display = 'none';
            gameScreen.style.display = 'block';

            updateStats();
            nextQuestion();
        }

        // 下一题
        function nextQuestion() {
            gameState.currentQuestion++;
            gameState.canAnswer = true;

            // 生成题目 (1-9 之间的乘法)
            const num1 = Math.floor(Math.random() * 9) + 1;
            const num2 = Math.floor(Math.random() * 9) + 1;
            gameState.currentAnswer = num1 * num2;

            // 显示题目
            questionDisplay.textContent = `${num1} × ${num2} = ?`;

            // 生成选项 (1个正确 + 3个错误)
            const options = generateOptions(gameState.currentAnswer);
            renderOptions(options);

            // 记录开始时间
            gameState.questionStartTime = Date.now();

            // 更新统计
            updateStats();
        }

        // 生成选项
        function generateOptions(correctAnswer) {
            const options = [correctAnswer];

            // 生成3个混淆项
            while (options.length < 4) {
                let wrongAnswer;
                if (Math.random() > 0.5) {
                    const offset = Math.floor(Math.random() * 5) + 1;
                    wrongAnswer = correctAnswer + (Math.random() > 0.5 ? offset : -offset);
                } else {
                    wrongAnswer = Math.floor(Math.random() * 81) + 1;
                }

                if (wrongAnswer > 0 && !options.includes(wrongAnswer)) {
                    options.push(wrongAnswer);
                }
            }

            // 打乱顺序
            return shuffleArray(options);
        }

        // 打乱数组
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        // 渲染选项
        function renderOptions(options) {
            optionsGrid.innerHTML = '';
            options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.dataset.value = option;
                btn.addEventListener('click', () => selectAnswer(option, btn));
                optionsGrid.appendChild(btn);
            });
        }

        // 选择答案
        function selectAnswer(answer, btn) {
            if (!gameState.isPlaying || !gameState.canAnswer) {
                return;
            }

            gameState.canAnswer = false;

            // 计算用时
            const timeUsed = (Date.now() - gameState.questionStartTime) / 1000;
            gameState.totalTime += timeUsed;

            // 检查答案
            const isCorrect = answer === gameState.currentAnswer;

            if (isCorrect) {
                gameState.correctCount++;
                btn.classList.add('correct');
            } else {
                btn.classList.add('wrong');
                // 高亮正确答案
                const allBtns = optionsGrid.querySelectorAll('.option-btn');
                allBtns.forEach(button => {
                    if (parseInt(button.dataset.value) === gameState.currentAnswer) {
                        button.classList.add('correct');
                    }
                });
            }

            // 禁用所有按钮
            const allBtns = optionsGrid.querySelectorAll('.option-btn');
            allBtns.forEach(button => {
                button.disabled = true;
            });

            // 更新统计
            updateStats();

            // 延迟后进入下一题
            setTimeout(() => {
                nextQuestion();
            }, 800);
        }

        // 更新统计
        function updateStats() {
            currentQuestionEl.textContent = gameState.currentQuestion;
            correctCountEl.textContent = gameState.correctCount;

            if (gameState.currentQuestion > 0) {
                const avgTime = (gameState.totalTime / gameState.currentQuestion).toFixed(2);
                avgTimeEl.textContent = avgTime;
            }

            // 更新进度条
            const progress = Math.min((gameState.currentQuestion / 10) * 100, 100);
            progressFill.style.width = `${progress}%`;
        }

        // 停止游戏
        function stopGame() {
            if (!gameState.isPlaying) {
                return;
            }

            gameState.isPlaying = false;

            // 计算统计数据
            const avgTime = gameState.currentQuestion > 0
                ? (gameState.totalTime / gameState.currentQuestion).toFixed(2)
                : 0;
            const accuracy = gameState.currentQuestion > 0
                ? ((gameState.correctCount / gameState.currentQuestion) * 100).toFixed(1)
                : 0;

            // 显示结果
            document.getElementById('finalAvgTime').textContent = `${avgTime}秒`;
            document.getElementById('totalQuestions').textContent = gameState.currentQuestion;
            document.getElementById('finalCorrect').textContent = gameState.correctCount;
            document.getElementById('accuracy').textContent = `${accuracy}%`;

            gameScreen.style.display = 'none';
            resultScreen.style.display = 'block';
        }

        // 显示欢迎屏幕
        function showWelcome() {
            resultScreen.style.display = 'none';
            welcomeScreen.style.display = 'block';
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('游戏初始化完成');
        });
    </script>
</body>
</html>
